name: mutation

# Mutation testing measures assertion strength: it rewrites covered source
# (a `+` becomes a `-`, a `>` becomes a `>=`, a condition is negated) and
# re-runs the suite. A mutant the tests still pass on ("LIVED") is a line the
# suite executes but does not actually assert on  -  a gap line coverage cannot
# see. This gate runs go-gremlins (https://github.com/go-gremlins/gremlins)
# scoped to the pure-logic leaf packages where the signal is highest and the
# suite is fast: the authorization resolver, the deny-class vocabulary, and the
# per-session ceilings. The S3 / socket / streaming packages are excluded on
# purpose  -  they need the live MinIO rig and the peer-credential socket, which
# would make a mutation run enormous for little added signal over their own
# conformance and e2e suites. The scope lives in .gremlins.yaml at the repo
# root (coverpkg) so it is declared once.
#
# Two jobs, split by whether the tool can be honestly armed here:
#
#   gremlins (ADVISORY): the go-gremlins lens over the pure-logic packages and
#     the two containment guards. It surfaces the per-package efficacy/coverage
#     summary. It stays advisory (continue-on-error)  -  NOT armed  -  because it
#     kills a mutant on a timeout it calibrates from one clean run, and the
#     in-scope suites carry pgregory.net/rapid property tests that gremlins
#     re-runs per mutant. Real mutants land in the timed-out bucket, so BOTH
#     gremlins dimensions collapse to a load-driven number; a threshold there
#     would red on runner timing, not on a real regression. The go.mod parse
#     fix (module directive on line 1) still matters: gremlins now attributes
#     coverage to the real package paths instead of the former phantom 0/0, so
#     the advisory summary is meaningful even though it cannot gate.
#
#   mutation-floor (ARMED): scripts/mutation-floor.sh runs go-mutesting over the
#     custody-relevant packages (the authorization resolver and the
#     downloadable/credential-scope broker). go-mutesting resolves packages via
#     `go list` and kills on real test PASS/FAIL with no timeout calibration, so
#     its score is stable and armable. A score below the floor fails the job.
#
# Ratchet target: raise the mutation-floor floor toward the canon >=60 (the
# guards already read well above it) as the score stabilises, extend it to the
# path-containment guard once a rig-free slice is carved, and arm gremlins only
# if a de-flaked measurement path appears. See docs/ROADMAP.md "mutation gate
# arm".

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly, 03:00 UTC. The armed go-mutesting floor runs here, NOT per-PR:
    # go-mutesting's built-in executor hangs on branch/if mutants (its custom-exec
    # path has an unenforced `// TODO timeout`; confirmed on multiple authz
    # if-flip mutants), so a per-PR armed run could hang the hot path. Nightly
    # cadence tolerates the tool's hang-and-retry; the external timeout in
    # mutation-floor.sh turns a hang into a loud red an owner triages the next
    # morning. The per-PR path carries the advisory gremlins summary plus a
    # required freshness gate (below) that reds a PR if no green nightly floor
    # exists within the freshness window - so the nightly floor cannot rot into a
    # vacuous armed claim while PRs merge green.

permissions:
  contents: read

concurrency:
  # Cancel a superseded run on the same ref: a newer push obsoletes the older
  # run's result, and the armed floor is re-measured from scratch each time, so
  # cancelling the in-flight one wastes no signal.
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gremlins:
    runs-on: ubuntu-latest
    # ADVISORY: never blocks merge. gremlins' timeout-based kill is flaky on the
    # rapid property suites (see the header), so it surfaces the summary but the
    # armed floor lives in the mutation-floor job below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: install go-gremlins (pinned)
        # Pinned to the v0.6.0 release commit
        # (e05b1d47b8c55748e50abc28ff6b132c536bacca). The bare module version is
        # acceptable here because go install resolves it to that immutable commit
        # via the checksum database; the comment records the SHA for auditors.
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: gremlins unleash (advisory summary)
        # Advisory only (continue-on-error above): each unleash emits a
        # per-package efficacy/coverage summary and never fails the run. The
        # coverpkg scope and the exclude sets isolate the guard source files;
        # the two containment guards live in rig-heavy packages, so the
        # --exclude-files positive enumeration trims each package down to its
        # single guard file (RE2 has no negative lookahead).
        run: |
          set -u
          for pkg in ./internal/authz/ ./internal/denyclass/ ./internal/ceilings/; do
            echo "::group::gremlins unleash $pkg"
            gremlins unleash "$pkg" || echo "::warning::gremlins reported a non-zero exit for $pkg (advisory)"
            echo "::endgroup::"
          done
          echo "::group::gremlins unleash internal/objectstore/pathresolver.go"
          gremlins unleash \
            --exclude-files '(^|/)credentials\.go|(^|/)engine_local\.go|(^|/)engine_s3\.go|(^|/)objectstore\.go|(^|/)scope_confined\.go' \
            ./internal/objectstore/ \
            || echo "::warning::gremlins reported a non-zero exit for pathresolver.go (advisory)"
          echo "::endgroup::"
          echo "::group::gremlins unleash internal/southface/credscope.go"
          SF_EXC=$(ls internal/southface/*.go | grep -v _test | grep -v 'credscope.go' \
            | sed 's#internal/##; s/\./\\./g' | paste -sd'|' -)
          gremlins unleash --exclude-files "$SF_EXC" ./internal/southface/ \
            || echo "::warning::gremlins reported a non-zero exit for credscope.go (advisory)"
          echo "::endgroup::"

  mutation-floor:
    runs-on: ubuntu-latest
    # ARMED, NIGHTLY ONLY. A go-mutesting score below the floor in
    # scripts/mutation-floor.sh fails this job. Runs on the schedule trigger, not
    # per-PR (go-mutesting hangs on if-mutants; the external timeout in the script
    # turns that into a red rather than a hung hot-path job). The per-PR freshness
    # gate below enforces that a recent run of THIS job stayed green.
    if: github.event_name == 'schedule'
    # Job-level backstop: even if a go-mutesting hang defeats the in-script
    # per-invocation timeout, the whole job is bounded well under the 6h cap, so a
    # hang becomes a bounded red, never a run-to-cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: install go-mutesting (pinned)
        # The avito-tech fork carries no semver tag, so pin the module pseudo-
        # version (its immutable commit). go install verifies it against the
        # checksum database.
        run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb
      - name: mutation-floor (go-mutesting, armed)
        run: bash scripts/mutation-floor.sh

  mutation-floor-freshness:
    runs-on: ubuntu-latest
    # REQUIRED per-PR gate. The armed floor runs nightly (above), so this gate
    # keeps the nightly result from rotting into a vacuous armed claim: it reds a
    # PR if no SUCCESSFUL scheduled mutation-floor run exists within the freshness
    # window. One flaky night is absorbed (yesterday's green still satisfies the
    # window); a week of hangs/reds hardens into a fleet-wide PR blocker - the
    # honest meaning of "armed". Two non-vacuity guards: it counts only
    # conclusion=success on a `schedule`-triggered run (not a manual re-dispatch),
    # and the nightly's own no-score guard means a timeout-killed run is not green.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: require a green nightly mutation-floor within the window
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHNESS_DAYS: '7'
        run: |
          set -euo pipefail
          # Newest scheduled runs of THIS workflow, successful only.
          runs="$(gh run list --workflow mutation.yml --event schedule \
            --status success --limit 20 \
            --json databaseName,conclusion,event,createdAt 2>/dev/null || echo '[]')"
          latest="$(printf '%s' "$runs" \
            | jq -r '[.[] | select(.event=="schedule" and .conclusion=="success")] | sort_by(.createdAt) | last | .createdAt // empty')"
          if [ -z "$latest" ]; then
            echo "::error::no successful scheduled mutation-floor run found. The armed nightly floor has never gone green (or its history aged out). Dispatch the nightly and let it pass before merging." >&2
            exit 1
          fi
          # Age in days, computed without date-diff portability traps.
          now_epoch="$(date -u +%s)"
          run_epoch="$(date -u -d "$latest" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$latest" +%s)"
          age_days=$(( (now_epoch - run_epoch) / 86400 ))
          echo "latest green scheduled mutation-floor: ${latest} (${age_days}d ago; window ${FRESHNESS_DAYS}d)"
          if [ "$age_days" -gt "$FRESHNESS_DAYS" ]; then
            echo "::error::the newest green scheduled mutation-floor run is ${age_days}d old, older than the ${FRESHNESS_DAYS}d freshness window. The armed floor has gone stale - investigate the nightly (likely a go-mutesting hang) before merging." >&2
            exit 1
          fi
          echo "mutation-floor freshness: OK"
